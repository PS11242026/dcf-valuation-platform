[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcf-project"
version = "0.1.0"
description = "A validated DCF research platform: state-space (Kalman) FCF forecasting, portfolio construction, and Excel/PDF deliverables."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pydantic>=2.6",
  "requests>=2.31",
  "scipy>=1.11",
  "typer>=0.12",
  "yfinance>=0.2.40",
  "yahooquery>=2.3.7",
  "openpyxl>=3.1",
  "matplotlib>=3.8",
  "xlsxwriter>=3.2",
  "python-pptx>=0.6.23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.5",
]
charts = [
  "matplotlib>=3.8",
]
api = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.scripts]
dcf = "dcf_project.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pyflakes (F) and the default pycodestyle rules stay enforced. E702 (compact
# `a; b` one-liners) is used deliberately in the dense numeric/plotting/reporting
# code and is not treated as an error here.
ignore = ["E702"]
